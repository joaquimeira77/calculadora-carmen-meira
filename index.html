<body><title>Calculadora Carmen Meira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: app de uma coluna para iPhone, cartões creme sobre fundo de confeitaria, barra de abas fixa embaixo. Cores tiradas da logo. */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --surface-2:#F5ECE0; --line:#E9DCCB;
  --ink:#3F2421; --ink-2:#7B5C4E; --brown:#86512A; --caramel:#B5803F; --tan:#CDAE86;
  --on-ink:#FBF6EF; --good:#4E7A3B; --bad:#A3402E; --good-bg:#E8F0E1; --bad-bg:#F6E3DE; --car-bg:#F6EBDB;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1210; --surface:#271A16; --surface-2:#33231E; --line:#46322A;
  --ink:#F4E8D9; --ink-2:#C2A792; --brown:#D49A63; --caramel:#E0AE6E; --tan:#8E6C4C;
  --on-ink:#1B1210; --good:#9CC787; --bad:#E79A86; --good-bg:#24331D; --bad-bg:#3A201A; --car-bg:#3A2A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1210; --surface:#271A16; --surface-2:#33231E; --line:#46322A;
  --ink:#F4E8D9; --ink-2:#C2A792; --brown:#D49A63; --caramel:#E0AE6E; --tan:#8E6C4C;
  --on-ink:#1B1210; --good:#9CC787; --bad:#E79A86; --good-bg:#24331D; --bad-bg:#3A201A; --car-bg:#3A2A1C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}

/* Cabeçalho */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.top .logo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--tan)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--caramel);font-weight:700}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0;font-weight:700}

/* Cartões e campos */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;color:var(--ink-2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=text],input:not([type]),input[type=tel],input[type=date],input[type=search],select,textarea{
  width:100%;min-width:0;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;min-height:44px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--caramel);outline:none;background-color:var(--surface)}
textarea{min-height:88px;resize:vertical}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.money-in{position:relative}
.money-in::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:14px;pointer-events:none}
.money-in input{padding-left:36px}
.pct-in{position:relative}.pct-in::after{content:"%";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;font-weight:700;text-decoration:none;text-align:center}
.btn-main{background:var(--ink);color:var(--on-ink)}
.btn-car{background:var(--caramel);color:#fff}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-line{background:transparent;border:1.5px dashed var(--tan);color:var(--brown)}
.btn-danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.armed{background:var(--bad);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-wide{width:100%}
.link{background:none;border:0;color:var(--brown);font-weight:700;padding:6px 0;cursor:pointer}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink-2);font-size:20px;line-height:1;cursor:pointer}

/* Linhas de composição */
.lines{display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line>select,.line>.full{grid-column:1/-1}
.qty{display:flex;align-items:center;gap:6px;max-width:170px}
.qty input{text-align:right}
.qty em{font-style:normal;color:var(--ink-2);font-size:14px;min-width:28px}
.cost{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}

/* Multiplicador */
.mult{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.mult button{height:52px;border-radius:12px;border:0;background:var(--surface-2);font-size:26px;cursor:pointer;color:var(--ink)}
.mult label{display:flex;align-items:center;justify-content:center;background:var(--car-bg);border-radius:12px;height:52px;padding:0 10px}
.mult label span{font-family:var(--f-display);font-size:26px;color:var(--brown)}
.mult input{background:transparent!important;border:0!important;width:5ch;text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700;padding:0;min-height:0;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -2px;padding:2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}

/* Resultado: a "etiqueta" de preço, com os arcos da logo */
.result{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);border-radius:18px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:14px}
.result::before,.result::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.result::before{width:260px;height:260px;right:-110px;top:-120px;border:3px solid var(--brown);opacity:.55}
.result::after{width:220px;height:220px;right:-90px;top:-100px;border:2px solid var(--tan);opacity:.5}
.res-price{position:relative;display:flex;flex-direction:column;gap:2px}
.res-price span{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--tan);font-weight:700}
.res-price strong{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.res-price small{font-size:15px;opacity:.85}
.brk{margin:0;display:flex;flex-direction:column;gap:6px;position:relative}
.brk div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.brk dt{opacity:.8}.brk dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.brk .sum{border-top:1px solid color-mix(in srgb,var(--on-ink) 25%,transparent);padding-top:7px;margin-top:2px}
.brk .sum dt,.brk .sum dd{opacity:1;font-weight:700}
.brk .lucro dd{color:var(--tan);font-weight:700}

/* Interruptor */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:700}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--caramel)}
.switch input:checked::after{transform:translateX(20px)}

/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item small{grid-column:1;color:var(--ink-2);font-size:13.5px}
.item .r{grid-row:1/span 2;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums;font-weight:700}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.st-orcamento{background:var(--car-bg);color:var(--brown)}
.st-confirmado{background:var(--ink);color:var(--on-ink)}
.st-entregue{background:var(--good-bg);color:var(--good)}
.st-cancelado{background:var(--bad-bg);color:var(--bad)}
.ex{background:var(--car-bg);color:var(--brown);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.banner{background:var(--car-bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--brown);display:flex;justify-content:space-between;gap:10px;align-items:center}

/* Resumo do mês */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px}
.kpi span{display:block;font-size:12.5px;color:var(--ink-2)}
.kpi strong{font-family:var(--f-display);font-size:23px;font-variant-numeric:tabular-nums}

/* Orçamento */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.oline{display:grid;grid-template-columns:70px minmax(0,1fr) auto 36px;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.oline .full{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--caramel);white-space:nowrap}
.tot{display:flex;flex-direction:column;gap:6px}
.tot div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot .big{font-family:var(--f-display);font-size:24px;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.internal{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--brown);font-weight:700;padding:4px 0 10px;cursor:pointer;font-size:16px}

/* Barra de abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:6px 0;cursor:pointer}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--brown)}

/* Painel deslizante */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(30,15,10,.45)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.formula{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:12px;line-height:1.55}
.formula b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}.oline{grid-template-columns:60px minmax(0,1fr) auto 32px}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-a="closeSheet"></div><div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

const KEY="cmcd.calculadora.v1";

/* ---------- utilitários ---------- */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(isFinite(v)?v:0);
const fmtN=(v,d=2)=>Number(v||0).toLocaleString("pt-BR",{maximumFractionDigits:d});
const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;let s=String(v??"").trim().replace(/\s|R\$/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:0};
const vin=v=>v===""||v==null?"":String(v).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hoje=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dataBR=iso=>{if(!iso)return"";const[a,m,d]=iso.slice(0,10).split("-");return`${d}/${m}/${a}`};
const addDias=(iso,n)=>{const d=new Date(iso.slice(0,10)+"T12:00:00");d.setDate(d.getDate()+num(n));return d.toISOString().slice(0,10)};
const pad=n=>String(n).padStart(4,"0");
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

/* ---------- unidades e custos ---------- */
const UN={g:{b:"g",f:1},kg:{b:"g",f:1000},ml:{b:"ml",f:1},L:{b:"ml",f:1000},un:{b:"un",f:1}};
const byId=(col,id)=>S[col].find(x=>x.id===id);
const ingBase=i=>UN[i.un]?.b||"un";
const ingCustoBase=i=>{const q=num(i.qtd)*(UN[i.un]?.f||1);return q>0?num(i.preco)/q:0};
const recCusto=r=>(r.itens||[]).reduce((s,it)=>{const i=byId("ings",it.ref);return s+(i?ingCustoBase(i)*num(it.q):0)},0);
const recCustoUn=r=>num(r.rend)>0?recCusto(r)/num(r.rend):0;
const compCusto=c=>{if(c.t==="r"){const r=byId("recs",c.ref);return r?recCustoUn(r)*num(c.q):0}const i=byId("ings",c.ref);return i?ingCustoBase(i)*num(c.q):0};
const compUn=c=>{if(c.t==="r")return byId("recs",c.ref)?.un||"";const i=byId("ings",c.ref);return i?ingBase(i):""};
const arred=v=>{const a=num(S.cfg.arred);return a>0?Math.ceil(v/a-1e-9)*a:Math.round(v*100)/100};
const custoUnTxt=i=>{const c=ingCustoBase(i),b=ingBase(i);return b==="un"?`${money(c)} por unidade`:`${money(c*100)} por 100 ${b}`};

function calcular(p){
  const ing=(p.comps||[]).reduce((s,c)=>s+compCusto(c),0);
  const fixPct=num(p.fixos),fixos=ing*fixPct/100;
  const emb=(p.embs||[]).reduce((s,e)=>{const x=byId("embs",e.ref);return s+(x?num(x.preco)*num(e.q):0)},0);
  const mult=num(p.mult)||1,custo=ing+fixos+emb;
  const bruto=S.cfg.embMult?custo*mult:(ing+fixos)*mult+emb;
  const preco=custo>0?arred(bruto):0,lucro=preco-custo,rend=num(p.rend);
  const t=p.topo||{},topoV=t.on?num(t.valor):0,topoC=t.on?num(t.custo):0;
  return{ing,fixos,fixPct,emb,custo,mult,preco,lucro,rend,porUn:rend>0?preco/rend:0,topoV,topoC,total:preco+topoV};
}

function msgOrc(o){
  const t=orcTotais(o),L=[];

  if(num(o.desconto))L.push(`• Desconto: −${money(num(o.desconto))}`);
  L.push("",`*Total: ${money(t.total)}*`);

  lista.forEach(o=>{if(y>268){rodape(d);d.addPage();y=20;head()}
    d.setTextColor(...COR.choc);d.text(pad(o.num),col[0],y+6);d.text(d.splitTextToSize(o.cliente||"-",68)[0],col[1],y+6);
    d.text(o.entrega?dataBR(o.entrega):"-",col[2],y+6);d.text(ST[o.status],col[3],y+6);d.text(money(orcTotais(o).total),col[4],y+6,{align:"right"});
    y+=9;d.setDrawColor(...COR.tan);d.setLineWidth(.2);d.line(M,y,W-M,y)});
  y+=8;if(y>255){rodape(d);d.addPage();y=20}
  const soma=st=>lista.filter(o=>st.includes(o.status)).reduce((s,o)=>s+orcTotais(o).total,0);
  d.setFontSize(10.5);[["Pedidos confirmados e entregues",soma(["confirmado","entregue"])],["Orçamentos em aberto",soma(["orcamento"])]].forEach(([l,v])=>{
    d.setTextColor(...COR.mute);d.text(l,140,y,{align:"right"});d.setTextColor(...COR.choc);d.setFont("helvetica","bold");d.text(money(v),col[4],y,{align:"right"});d.setFont("helvetica","normal");y+=6.5});
  rodape(d);return d;
}
async function compartilhar(blob,nome,titulo){
  const file=new File([blob],nome,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:titulo});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}catch(e){}
  toast(window.self!==window.top?"Nesta prévia o arquivo não abre. No iPhone, abre o menu de compartilhar.":"Arquivo gerado");
}
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase();

/* ---------- interface auxiliar ---------- */
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function openSheet(html){$("#sheet-body").innerHTML=html;$("#sheet").hidden=false}
function closeSheet(){$("#sheet").hidden=true;$("#sheet-body").innerHTML="";DRAFT=null}
function arm(b,fn){if(b.classList.contains("armed")){fn();return}const txt=b.textContent;b.classList.add("armed");b.textContent="Toque de novo para confirmar";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent=txt}},3500)}
function go(tab){S.ui.tab=tab;save();render();window.scrollTo(0,0)}

/* ---------- ligação de campos ---------- */
function roots(){return{calc:S.calc,cfg:S.cfg,orc:curOrc(),draft:DRAFT&&DRAFT.o}}
function setPath(path,el){
  const p=path.split("."),root=roots()[p[0]];if(!root)return;let o=root;
  for(let i=1;i<p.length-1;i++)o=o[p[i]];
  const key=p[p.length-1];let v=el.type==="checkbox"?el.checked:el.value;
  if(key==="sel"){const[t,ref]=v?[v[0],v.slice(2)]:[o.t,""];o.t=t;o.ref=ref;if(t==="r"&&ref&&!num(o.q))o.q=byId("recs",ref)?.rend||"";return}
  if(p[0]==="cfg"&&["arred","validade"].includes(key))v=num(v);
  o[key]=v;
}
function afterSet(root,full){
  save();
  if(root==="draft"){if(full)$("#sheet-body").innerHTML=sheetCad();else refreshDraft();return}
  if(full){const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(root==="calc")refreshCalc();if(root==="orc")refreshOrc();
}
document.addEventListener("input",e=>{
  if(e.target.matches("[data-busca]")){const q=e.target.value.toLowerCase().trim();document.querySelectorAll("#cad-list .item").forEach(i=>i.hidden=q&&!i.dataset.nome.includes(q));return}
  const el=e.target.closest("[data-f]");if(!el||el.tagName==="SELECT"||el.type==="checkbox")return;
  setPath(el.dataset.f,el);afterSet(el.dataset.f.split(".")[0],false);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ch){CH[el.dataset.ch](el.value);return}
  if(!el.matches("[data-f]")||!(el.tagName==="SELECT"||el.type==="checkbox"))return;
  setPath(el.dataset.f,el);afterSet(el.dataset.f.split(".")[0],true);
});
const CH={
  loadProd(id){const p=byId("prods",id);if(!p)return;S.calc=Object.assign(clone(p),{prodId:p.id});delete S.calc.id;delete S.calc.ex;if(!S.calc.topo)S.calc.topo={on:false};save();render();toast("Produto carregado")},
  topoPick(id){const t=S.calc.topo,x=byId("topos",id);t.ref=id;if(x){t.desc=x.nome;t.custo=x.custo;t.valor=x.valor}save();render()}
};

/* ---------- ações ---------- */
const A={
  tab:b=>{if(b.dataset.v==="orcs"&&S.ui.tab==="orcs")S.ui.orc=null;go(b.dataset.v)},
  calcNovo:b=>arm(b,()=>{S.calc=calcVazio();save();render();window.scrollTo(0,0)}),
  addComp:()=>{S.calc.comps.push({t:"i",ref:"",q:""});save();render();const k=S.calc.comps.length-1;$(`#c-comp-${k}`)?.focus()},
  rmComp:b=>{S.calc.comps.splice(+b.dataset.k,1);save();render()},
  addEmb:()=>{S.calc.embs.push({ref:"",q:1});save();render()},
  rmEmb:b=>{S.calc.embs.splice(+b.dataset.k,1);save();render()},
  multUp:()=>{S.calc.mult=Math.round((num(S.calc.mult)+.1)*10)/10;save();$("#c-mult").value=vin(S.calc.mult);refreshCalc()},
  multDn:()=>{S.calc.mult=Math.max(1,Math.round((num(S.calc.mult)-.1)*10)/10);save();$("#c-mult").value=vin(S.calc.mult);refreshCalc()},
  setMult:b=>{S.calc.mult=num(b.dataset.v);save();$("#c-mult").value=vin(S.calc.mult);refreshCalc()},
  salvarProd:()=>salvarProduto(false),
  salvarProdNovo:()=>salvarProduto(true),
  addAoOrc:()=>{
    if(calcular(S.calc).preco<=0){toast("Adicione ingredientes antes de orçar");return}
    const abertos=S.orcs.filter(o=>o.status==="orcamento").sort((a,b)=>b.num-a.num);
    openSheet(`<div class="stack"><h2>Pôr em qual orçamento?</h2>
      <button class="btn btn-main btn-wide" data-a="pickOrc" data-id="">+ Novo orçamento</button>
      ${abertos.length?`<h3>Orçamentos em aberto</h3><div class="list">${abertos.map(o=>`<button class="item" data-a="pickOrc" data-id="${o.id}"><b>${esc(o.cliente||"Sem nome")}</b><small>Nº ${pad(o.num)} · ${o.itens.length} itens</small><span class="r">${money(orcTotais(o).total)}</span></button>`).join("")}</div>`:""}
      <button class="btn btn-soft btn-wide" data-a="closeSheet">Cancelar</button></div>`);
  },
  pickOrc:b=>{const o=b.dataset.id?S.orcs.find(x=>x.id===b.dataset.id):novoOrc();o.itens.push(...itensDoCalc());S.ui.orc=o.id;closeSheet();go("orcs");toast("Adicionado ao orçamento")},
  novoOrc:()=>{const o=novoOrc();S.ui.orc=o.id;save();render();window.scrollTo(0,0)},
  openOrc:b=>{S.ui.orc=b.dataset.id;save();render();window.scrollTo(0,0)},
  voltarOrcs:()=>{S.ui.orc=null;save();render();window.scrollTo(0,0)},
  filtro:b=>{S.ui.filtro=b.dataset.v;save();render()},
  setStatus:b=>{const o=curOrc();o.status=b.dataset.v;save();const y=scrollY;render();scrollTo(0,y)},
  irCalc:()=>{go("calc");toast("Calcule o produto e toque em “Pôr no orçamento”")},
  addAvulso:()=>{curOrc().itens.push({id:uid(),tipo:"extra",desc:"",qtd:1,unit:"",custo:0});save();render();$(`#o-d-${curOrc().itens.length-1}`)?.focus()},
  addTopo:()=>{
    if(!S.topos.length){curOrc().itens.push({id:uid(),tipo:"topo",desc:"Topo de bolo",qtd:1,unit:"",custo:0});save();render();return}
    openSheet(`<div class="stack"><h2>Qual topo de bolo?</h2><div class="list">${S.topos.map(t=>`<button class="item" data-a="pickTopo" data-id="${t.id}"><b>${esc(t.nome)}</b><small>custo ${money(num(t.custo))}</small><span class="r">${money(num(t.valor))}</span></button>`).join("")}
      <button class="item" data-a="pickTopo" data-id=""><b>Personalizado</b><small>Preencher descrição e valor</small></button></div><button class="btn btn-soft btn-wide" data-a="closeSheet">Cancelar</button></div>`)},
  pickTopo:b=>{const t=byId("topos",b.dataset.id);curOrc().itens.push({id:uid(),tipo:"topo",desc:"Topo de bolo"+(t?": "+t.nome.replace(/^topo (de bolo )?/i,"").toLowerCase():""),qtd:1,unit:t?num(t.valor):"",custo:t?num(t.custo):0});closeSheet();save();render()},
  rmItem:b=>{curOrc().itens.splice(+b.dataset.k,1);save();const y=scrollY;render();scrollTo(0,y)},
  pdfOrc:()=>{const o=curOrc();if(!o.itens.length){toast("Adicione ao menos um item");return}const d=pdfOrc(o);if(!d)return;
    compartilhar(d.output("blob"),`orcamento-${pad(o.num)}-${slug(o.cliente)||"cliente"}.pdf`,`Orçamento ${pad(o.num)}`)},
  dupOrc:()=>{const o=clone(curOrc());Object.assign(o,{id:uid(),num:S.cfg.seq++,data:hoje(),status:"orcamento",sinal:"",ex:false});o.itens.forEach(i=>i.id=uid());S.orcs.push(o);S.ui.orc=o.id;save();render();scrollTo(0,0);toast(`Cópia criada: nº ${pad(o.num)}`)},
  delOrc:b=>arm(b,()=>{S.orcs=S.orcs.filter(o=>o.id!==S.ui.orc);S.ui.orc=null;save();render();toast("Orçamento excluído")}),
  exportHist:()=>{const f=S.ui.filtro,l=S.orcs.filter(o=>f==="todos"||o.status===f).sort((a,b)=>a.num-b.num);const d=pdfHist(l);if(d)compartilhar(d.output("blob"),`historico-orcamentos-${hoje()}.pdf`,"Histórico de orçamentos")},
  cadTab:b=>{S.ui.cad=b.dataset.v;save();render()},
  novoCad:()=>{const k=S.ui.cad,o={ings:{nome:"",preco:"",qtd:"",un:"g"},recs:{nome:"",rend:"",un:"g",itens:[{ref:"",q:""}]},embs:{nome:"",preco:""},topos:{nome:"",custo:"",valor:""}}[k];
    DRAFT={k,o:Object.assign({id:uid()},o),novo:true};openSheet(sheetCad());setTimeout(()=>$("#d-nome")?.focus(),80)},
  editCad:b=>{const k=S.ui.cad;DRAFT={k,o:clone(byId(k,b.dataset.id)),novo:false};openSheet(sheetCad())},
  addRecItem:()=>{DRAFT.o.itens.push({ref:"",q:""});$("#sheet-body").innerHTML=sheetCad()},
  rmRecItem:b=>{DRAFT.o.itens.splice(+b.dataset.k,1);$("#sheet-body").innerHTML=sheetCad()},
  saveDraft:()=>{const{k,o}=DRAFT;if(!String(o.nome).trim()){toast("Dê um nome antes de salvar");$("#d-nome")?.focus();return}
    o.ex=false;if(k==="recs")o.itens=o.itens.filter(i=>i.ref);
    const i=S[k].findIndex(x=>x.id===o.id);if(i>=0)S[k][i]=o;else S[k].push(o);save();closeSheet();render();toast("Salvo")},
  delDraft:b=>arm(b,()=>{const{k,o}=DRAFT;S[k]=S[k].filter(x=>x.id!==o.id);if(k==="prods"&&S.calc.prodId===o.id)S.calc.prodId=null;save();closeSheet();render();toast("Excluído")}),
  abrirProd:()=>{const id=DRAFT.o.id;closeSheet();CH.loadProd(id);go("calc")},
  closeSheet:()=>closeSheet(),
  exportBackup:()=>{const data=Object.assign({},S,{_app:"calculadora-carmen-meira",_versao:1,_data:new Date().toISOString()});
    compartilhar(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),`backup-carmen-meira-${hoje()}.json`,"Backup da calculadora")},
  importBackup:()=>$("#fileImport").click(),
  confirmImport:()=>{if(!window._imp)return;S=window._imp;window._imp=null;save();closeSheet();render();toast("Backup restaurado")},
  rmExemplos:b=>arm(b,()=>{
    const exIds=new Set();["ings","recs","embs","topos","prods"].forEach(k=>S[k].forEach(x=>x.ex&&exIds.add(x.id)));
    ["ings","recs","embs","topos","prods","orcs"].forEach(k=>S[k]=S[k].filter(x=>!x.ex));
    S.calc=calcVazio();save();render();toast("Exemplos apagados")})
};
function salvarProduto(comoNovo){
  const c=S.calc;if(!c.nome.trim()){toast("Dê um nome ao produto");$("#c-nome")?.focus();return}
  const dados=clone(c);delete dados.prodId;
  if(!comoNovo&&c.prodId&&byId("prods",c.prodId)){const i=S.prods.findIndex(p=>p.id===c.prodId);S.prods[i]=Object.assign(dados,{id:c.prodId});toast("Produto atualizado")}
  else{const id=uid();S.prods.push(Object.assign(dados,{id}));c.prodId=id;toast("Produto salvo")}
  save();render();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
$("#fileImport").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!Array.isArray(d.ings))throw 0;
    window._imp=d;openSheet(`<div class="stack"><h2>Restaurar este backup?</h2><p class="hint">Backup de ${d._data?dataBR(d._data.slice(0,10)):"data desconhecida"} com ${d.ings.length} ingredientes, ${(d.recs||[]).length} receitas e ${(d.orcs||[]).length} orçamentos. Os dados atuais deste iPhone serão substituídos.</p>
      <div class="btn-row"><button class="btn btn-soft" data-a="closeSheet">Cancelar</button><button class="btn btn-main" data-a="confirmImport">Restaurar</button></div></div>`)}
    catch(err){toast("Este arquivo não é um backup da calculadora")}};
  r.readAsText(f);
});

/* ---------- início ---------- */
S=load();
if(S.ui.orc&&!curOrc())S.ui.orc=null;
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:"&&window.self===window.top){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
